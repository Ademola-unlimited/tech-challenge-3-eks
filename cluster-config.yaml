apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: enterprise-cluster
  region: us-east-1
  version: "1.34"

availabilityZones:
  - us-east-1a
  - us-east-1b

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.small
    desiredCapacity: 3
    minSize: 3
    maxSize: 6
    volumeSize: 20
    privateNetworking: true
